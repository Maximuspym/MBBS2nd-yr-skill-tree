<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a06">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MBBS Tree">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="MBBS Medical Knowledge Skill Tree — Pratim">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">

<title>MBBS Skill Tree</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

:root {
  --bg:#0c0a06; --bg2:#130f08;
  --sand:#c8a96e; --sand-dim:#8a7045;
  --gold:#f0c060; --gold-hot:#ffdd88;
  --amber:#e8922a; --amber-dim:#7a4e16;
  --ember:#ff6b2b;
  --path-c:#4ab8ff; --micro-c:#ff7055; --pharm-c:#5ddc8a;
  --locked:#3a3020; --locked-b:#5a4a30;
  --text:#e8dcc8; --dim-text:#8a7a60;
  --panel:rgba(13,10,6,0.96);
  --border:rgba(200,169,110,0.2);
  --glow-path:rgba(74,184,255,0.35);
  --glow-micro:rgba(255,112,85,0.35);
  --glow-pharm:rgba(93,220,138,0.35);
  --glow-gold:rgba(240,192,96,0.4);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Crimson Pro',Georgia,serif;
  user-select:none;
  -webkit-user-select:none;
}

/* vignette */
body::before{
  content:'';position:fixed;inset:0;z-index:1000;pointer-events:none;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 35%,rgba(5,3,1,0.65) 100%);
}

#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.08;}

/* ═══ HUD — Mobile compact ═══ */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:600;
  background:linear-gradient(180deg,rgba(8,6,3,0.99) 0%,rgba(8,6,3,0.92) 80%,transparent 100%);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding-top:var(--safe-top);
}
.hud-row1{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px 6px;
  gap:10px;
}
.hud-row2{
  display:flex;align-items:center;gap:8px;
  padding:0 14px 8px;
  overflow-x:auto;
  scrollbar-width:none;
}
.hud-row2::-webkit-scrollbar{display:none;}

/* Player */
.player-card{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.player-avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--amber-dim),var(--amber));
  border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;
  box-shadow:0 0 10px var(--glow-gold);
  flex-shrink:0;
}
.player-name{font-family:'Cinzel Decorative',serif;font-size:0.78rem;color:var(--gold);letter-spacing:0.06em;}
.player-title{font-size:0.52rem;color:var(--sand-dim);letter-spacing:0.1em;text-transform:uppercase;margin-top:1px;}

/* Overall prog */
.overall-wrap{flex:1;min-width:0;}
.prog-label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.prog-label-txt{font-family:'Cinzel',serif;font-size:0.48rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--sand-dim);}
.prog-pct{font-family:'Cinzel',serif;font-size:0.7rem;color:var(--gold);font-weight:700;}
.prog-bar{height:4px;background:rgba(200,169,110,0.1);border-radius:2px;overflow:hidden;}
.prog-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--amber-dim),var(--gold),var(--gold-hot));
  transition:width .6s cubic-bezier(.34,1.2,.64,1);
  box-shadow:0 0 6px var(--glow-gold);
}

/* Goal btn */
.goal-btn{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:20px;
  border:1px solid var(--border);
  background:rgba(200,169,110,0.05);
  cursor:pointer;flex-shrink:0;
  transition:all .2s;
}
.goal-btn:active{background:rgba(200,169,110,0.12);}
.goal-btn-label{font-family:'Cinzel',serif;font-size:0.48rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--sand-dim);}
.goal-btn-pct{font-family:'Cinzel',serif;font-size:0.72rem;color:var(--amber);font-weight:700;}

/* Subj pills */
.subj-pill{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:20px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  flex-shrink:0;white-space:nowrap;
}
.subj-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.subj-pill-name{font-family:'Cinzel',serif;font-size:0.48rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--sand-dim);}
.subj-pill-pct{font-size:0.65rem;font-weight:700;margin-left:2px;}

/* ═══ VIEWPORT ═══ */
#viewport{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  z-index:1;
  overflow:hidden;
  touch-action:none;
  cursor:grab;
}
#world{position:absolute;transform-origin:0 0;will-change:transform;}
#svg-layer{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}

/* ═══ EDGES ═══ */
.edge{fill:none;stroke-width:1.6;stroke-dasharray:6 5;transition:opacity .3s,stroke-width .2s;}
.edge.prereq{stroke:var(--sand-dim);opacity:.15;}
.edge.cross{stroke:var(--gold);opacity:.1;stroke-dasharray:4 6;}
.edge.unlocked-prereq{opacity:.4;}
.edge.active{opacity:1!important;stroke-width:2.5!important;filter:drop-shadow(0 0 4px currentColor);}
.edge.dimmed{opacity:.03!important;}
@keyframes dash-flow{from{stroke-dashoffset:0;}to{stroke-dashoffset:-44;}}
.edge.active{animation:dash-flow 1.6s linear infinite;}

/* ═══ NODES ═══ */
.node{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;z-index:2;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.node:active{transform:translate(-50%,-50%) scale(0.93);}
.node.selected{transform:translate(-50%,-50%) scale(1.1);z-index:10;}

.node-halo{
  position:absolute;border-radius:50%;border:1px solid;
  opacity:0;transform:scale(1.4);
  transition:opacity .4s,transform .4s;
  pointer-events:none;
}
.node.selected .node-halo{opacity:.6;transform:scale(1.5);}
@keyframes halo-pulse{0%,100%{transform:scale(1.45);opacity:.5;}50%{transform:scale(1.62);opacity:.22;}}
.node.completed .node-halo{animation:halo-pulse 2.5s ease-in-out infinite;opacity:.5;transform:scale(1.5);}

.node-circle{
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px solid;position:relative;
  transition:box-shadow .3s,background .3s,border-color .3s;flex-shrink:0;
}
.node.sz-sm .node-circle{width:40px;height:40px;}
.node.sz-md .node-circle{width:50px;height:50px;}
.node.sz-lg .node-circle{width:60px;height:60px;}
.node.sz-sm .node-halo{width:54px;height:54px;top:-7px;left:-7px;}
.node.sz-md .node-halo{width:66px;height:66px;top:-8px;left:-8px;}
.node.sz-lg .node-halo{width:78px;height:78px;top:-9px;left:-9px;}

.node-icon{font-size:1.15rem;line-height:1;position:relative;z-index:1;}
.node.sz-sm .node-icon{font-size:.9rem;}
.node.sz-lg .node-icon{font-size:1.4rem;}

.node-check{
  position:absolute;bottom:-2px;right:-2px;
  width:14px;height:14px;border-radius:50%;
  background:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:.55rem;color:#0c0a06;font-weight:900;
  opacity:0;transform:scale(0);
  transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1);z-index:3;
}
.node.completed .node-check{opacity:1;transform:scale(1);}

.node-label{
  margin-top:5px;font-family:'Cinzel',serif;font-size:.5rem;font-weight:600;
  text-align:center;max-width:70px;line-height:1.3;letter-spacing:.03em;text-transform:uppercase;
  transition:color .3s;
}
.node.sz-lg .node-label{font-size:.55rem;max-width:78px;}

/* locked */
.node.locked .node-circle{background:#181208;border-color:var(--locked-b);box-shadow:none;}
.node.locked .node-halo{border-color:var(--locked-b);}
.node.locked .node-icon{filter:brightness(.25) sepia(1);}
.node.locked .node-label{color:var(--locked-b);}

/* path */
.node.path:not(.locked) .node-circle{background:rgba(74,184,255,.08);border-color:var(--path-c);}
.node.path:not(.locked) .node-halo{border-color:var(--path-c);}
.node.path:not(.locked) .node-label{color:#a0d8f8;}
.node.path.selected .node-circle{box-shadow:0 0 18px var(--glow-path),0 0 40px rgba(74,184,255,.1);}
.node.path.completed .node-circle{background:rgba(74,184,255,.18);box-shadow:0 0 22px var(--glow-path);}
/* micro */
.node.micro:not(.locked) .node-circle{background:rgba(255,112,85,.08);border-color:var(--micro-c);}
.node.micro:not(.locked) .node-halo{border-color:var(--micro-c);}
.node.micro:not(.locked) .node-label{color:#ffb09a;}
.node.micro.selected .node-circle{box-shadow:0 0 18px var(--glow-micro),0 0 40px rgba(255,112,85,.1);}
.node.micro.completed .node-circle{background:rgba(255,112,85,.18);box-shadow:0 0 22px var(--glow-micro);}
/* pharm */
.node.pharm:not(.locked) .node-circle{background:rgba(93,220,138,.08);border-color:var(--pharm-c);}
.node.pharm:not(.locked) .node-halo{border-color:var(--pharm-c);}
.node.pharm:not(.locked) .node-label{color:#a0f0c0;}
.node.pharm.selected .node-circle{box-shadow:0 0 18px var(--glow-pharm),0 0 40px rgba(93,220,138,.1);}
.node.pharm.completed .node-circle{background:rgba(93,220,138,.18);box-shadow:0 0 22px var(--glow-pharm);}

@keyframes unlock-burst{0%{transform:translate(-50%,-50%) scale(.5);opacity:1;}60%{transform:translate(-50%,-50%) scale(2.2);opacity:.8;}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0;}}
.unlock-burst{position:absolute;border-radius:50%;border:2px solid var(--gold);width:56px;height:56px;pointer-events:none;animation:unlock-burst .7s ease-out forwards;z-index:20;}

/* ═══ BOTTOM SHEET (replaces side panel on mobile) ═══ */
#bottom-sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:700;
  background:var(--bg2);
  border-top:1px solid rgba(240,192,96,0.2);
  border-radius:20px 20px 0 0;
  transform:translateY(100%);
  transition:transform .4s cubic-bezier(.34,1.1,.64,1);
  max-height:72vh;
  display:flex;flex-direction:column;
  padding-bottom:var(--safe-bot);
  box-shadow:0 -20px 60px rgba(0,0,0,.7);
}
#bottom-sheet.open{transform:translateY(0);}

.sheet-handle{
  width:36px;height:4px;background:rgba(200,169,110,.3);
  border-radius:2px;margin:10px auto 0;flex-shrink:0;
}
.sheet-header{
  padding:12px 18px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
  background:linear-gradient(180deg,rgba(240,192,96,.05) 0%,transparent 100%);
}
.sheet-badge{font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:.22em;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.badge-dot{width:6px;height:6px;border-radius:50%;}
.sheet-title{font-family:'Cinzel',serif;font-size:.92rem;font-weight:700;color:var(--gold);line-height:1.2;}
.sheet-ref{margin-top:3px;font-size:.62rem;color:var(--sand-dim);font-style:italic;}

.sheet-body{flex:1;overflow-y:auto;padding:12px 18px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}

.sheet-desc{font-size:.76rem;color:#c8b898;line-height:1.6;}
.sheet-section{font-family:'Cinzel',serif;font-size:.46rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sand-dim);margin-bottom:5px;}

.prereq-pill{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(200,169,110,.08);border:1px solid var(--border);
  border-radius:20px;padding:4px 10px;font-size:.62rem;
  color:var(--sand);margin:2px;cursor:pointer;
  transition:all .15s;
}
.prereq-pill.done{border-color:rgba(93,220,138,.4);color:var(--pharm-c);}
.prereq-pill .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}

.unlock-status{
  display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:8px;
  font-size:.68rem;font-weight:600;font-family:'Cinzel',serif;letter-spacing:.04em;
}
.unlock-status.locked{background:rgba(90,74,48,.2);color:var(--locked-b);border:1px solid rgba(90,74,48,.4);}
.unlock-status.unlocked{background:rgba(74,184,255,.08);color:#80c8ff;border:1px solid rgba(74,184,255,.2);}
.unlock-status.done{background:rgba(240,192,96,.1);color:var(--gold);border:1px solid rgba(240,192,96,.3);}

.sheet-footer{
  padding:10px 18px;border-top:1px solid var(--border);
  display:flex;gap:8px;flex-shrink:0;
}
.complete-btn{
  flex:1;padding:13px;border-radius:10px;cursor:pointer;
  font-family:'Cinzel',serif;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  transition:all .2s;border:1px solid;
}
.complete-btn.mark{background:rgba(240,192,96,.12);border-color:var(--gold);color:var(--gold);}
.complete-btn.mark:active{background:var(--gold);color:#0c0a06;box-shadow:0 0 18px var(--glow-gold);}
.complete-btn.unmark{background:rgba(255,107,43,.08);border-color:var(--ember);color:var(--ember);}
.complete-btn.unmark:active{background:rgba(255,107,43,.2);}
.goal-toggle-btn{
  padding:13px 15px;border-radius:10px;cursor:pointer;
  font-size:.95rem;border:1px solid var(--border);
  background:rgba(200,169,110,.05);color:var(--sand-dim);
  transition:all .2s;
}
.goal-toggle-btn.in-goal{border-color:var(--amber);color:var(--amber);background:rgba(232,146,42,.1);}

/* ═══ GOAL MODAL ═══ */
#goal-modal{
  position:fixed;inset:0;z-index:800;
  background:rgba(5,3,1,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;flex-direction:column;
  padding-bottom:var(--safe-bot);
}
#goal-modal.open{display:flex;}
.modal-box{
  background:var(--bg2);border-top:1px solid rgba(240,192,96,.25);
  border-radius:20px 20px 0 0;
  margin-top:auto;
  max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 -24px 70px rgba(0,0,0,.7);
}
.modal-handle{width:36px;height:4px;background:rgba(200,169,110,.3);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.modal-header{padding:14px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-title{font-family:'Cinzel Decorative',serif;font-size:.88rem;color:var(--gold);}
.modal-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--sand-dim);cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;}

.goal-name-section{display:flex;flex-direction:column;gap:5px;}
.goal-name-label{font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sand-dim);}
.goal-name-input{
  background:rgba(200,169,110,.05);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;color:var(--text);
  font-family:'Crimson Pro',serif;font-size:.88rem;outline:none;
  transition:border-color .2s;width:100%;
}
.goal-name-input:focus{border-color:var(--gold);}
.goal-name-input::placeholder{color:var(--sand-dim);}

.goal-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.goal-stat{background:rgba(200,169,110,.04);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;}
.goal-stat-val{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--gold);font-weight:700;}
.goal-stat-lbl{font-size:.52rem;color:var(--sand-dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}

.modal-subj-section{display:flex;flex-direction:column;gap:7px;}
.modal-subj-header{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-nodes{display:flex;flex-wrap:wrap;gap:6px;}
.goal-node-pill{
  background:rgba(200,169,110,.06);border:1px solid var(--border);
  border-radius:20px;padding:5px 11px;font-size:.65rem;
  color:var(--sand-dim);cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:4px;
}
.goal-node-pill:active{transform:scale(.95);}
.goal-node-pill.in-goal{border-color:var(--gold);color:var(--gold);background:rgba(240,192,96,.1);}
.goal-node-pill.in-goal.done{border-color:var(--pharm-c);color:var(--pharm-c);background:rgba(93,220,138,.08);}
.gnp-icon{font-size:.7rem;}

.modal-footer{padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0;}
.modal-save{
  width:100%;padding:13px;border-radius:10px;cursor:pointer;
  font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;letter-spacing:.08em;
  background:rgba(240,192,96,.12);border:1px solid var(--gold);color:var(--gold);
  transition:all .2s;
}
.modal-save:active{background:var(--gold);color:#0c0a06;}

/* ═══ FAB (zoom controls) ═══ */
#fab-wrap{
  position:fixed;right:14px;z-index:600;
  display:flex;flex-direction:column;gap:6px;
  bottom:calc(14px + var(--safe-bot));
  transition:bottom .4s cubic-bezier(.34,1.1,.64,1);
}
#fab-wrap.sheet-open{bottom:calc(72vh + 14px + var(--safe-bot));}

.fab{
  width:40px;height:40px;border-radius:12px;
  background:var(--panel);border:1px solid var(--border);
  color:var(--sand);font-family:'Cinzel',serif;font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:all .2s;box-shadow:0 4px 16px rgba(0,0,0,.4);
  -webkit-tap-highlight-color:transparent;
}
.fab:active{transform:scale(.9);border-color:var(--gold);color:var(--gold);}

/* ═══ TOAST ═══ */
#toast{
  position:fixed;bottom:calc(16px + var(--safe-bot));left:50%;
  transform:translateX(-50%) translateY(20px);
  z-index:900;
  background:rgba(18,13,6,.95);border:1px solid rgba(240,192,96,.3);
  border-radius:30px;padding:9px 18px;
  font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.06em;
  color:var(--gold);pointer-events:none;
  opacity:0;transition:opacity .3s,transform .3s;
  backdrop-filter:blur(12px);text-align:center;white-space:nowrap;
  max-width:90vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ═══ OFFLINE BANNER ═══ */
#offline-banner{
  position:fixed;top:calc(64px + var(--safe-top));left:0;right:0;
  background:rgba(232,146,42,.15);border-bottom:1px solid rgba(232,146,42,.3);
  text-align:center;padding:5px;z-index:800;
  font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.1em;color:var(--amber);
  display:none;
}

/* ═══ LEGEND (small) ═══ */
#legend{
  position:fixed;left:12px;z-index:600;
  bottom:calc(14px + var(--safe-bot));
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;backdrop-filter:blur(8px);
  display:flex;flex-direction:column;gap:4px;
}
.leg-item{display:flex;align-items:center;gap:6px;font-size:.55rem;color:var(--sand-dim);}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.leg-line{width:18px;height:0;flex-shrink:0;border-top:1.5px dashed;}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}

<body>

<canvas id="bg-canvas"></canvas>
<div id="offline-banner">📡 Offline — using cached data</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-row1">
    <div class="player-card">
      <div class="player-avatar">⚕</div>
      <div>
        <div class="player-name">Pratim</div>
        <div class="player-title">MBBS Scholar</div>
      </div>
    </div>
    <div class="overall-wrap">
      <div class="prog-label-row">
        <span class="prog-label-txt">Overall Mastery</span>
        <span class="prog-pct" id="overall-pct">0%</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="overall-fill" style="width:0%"></div></div>
    </div>
    <div class="goal-btn" onclick="openGoalModal()">
      <span style="font-size:.85rem">🎯</span>
      <div>
        <div class="goal-btn-label" id="goal-name-display">Goal</div>
        <div class="goal-btn-pct" id="goal-pct-display">—</div>
      </div>
    </div>
  </div>
  <div class="hud-row2">
    <div class="subj-pill">
      <div class="subj-dot" style="background:var(--path-c)"></div>
      <span class="subj-pill-name">Path</span>
      <span class="subj-pill-pct" style="color:var(--path-c)" id="path-pct">0%</span>
    </div>
    <div class="subj-pill">
      <div class="subj-dot" style="background:var(--micro-c)"></div>
      <span class="subj-pill-name">Micro</span>
      <span class="subj-pill-pct" style="color:var(--micro-c)" id="micro-pct">0%</span>
    </div>
    <div class="subj-pill">
      <div class="subj-dot" style="background:var(--pharm-c)"></div>
      <span class="subj-pill-name">Pharm</span>
      <span class="subj-pill-pct" style="color:var(--pharm-c)" id="pharm-pct">0%</span>
    </div>
    <div class="subj-pill" style="cursor:pointer;border-color:rgba(200,169,110,.3)" onclick="openGoalModal()">
      <span style="font-size:.7rem">📊</span>
      <span class="subj-pill-name">Set Goals</span>
    </div>
  </div>
</div>

<!-- VIEWPORT -->
<div id="viewport">
  <div id="world"><svg id="svg-layer"></svg></div>
</div>

<!-- BOTTOM SHEET -->
<div id="bottom-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-badge" id="sheet-badge"></div>
    <div class="sheet-title" id="sheet-title">Tap a node to explore</div>
    <div class="sheet-ref" id="sheet-ref"></div>
  </div>
  <div class="sheet-body">
    <div id="sheet-status"></div>
    <div id="sheet-desc" class="sheet-desc"></div>
    <div id="sheet-prereqs"></div>
    <div id="sheet-unlocks"></div>
  </div>
  <div class="sheet-footer">
    <button class="complete-btn mark" id="complete-btn" onclick="toggleComplete()">Mark as Mastered</button>
    <button class="goal-toggle-btn" id="goal-toggle-btn" onclick="toggleGoal()">🎯</button>
  </div>
</div>

<!-- GOAL MODAL -->
<div id="goal-modal" onclick="handleModalBgClick(event)">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">⚔ Semester Goal</div>
      <button class="modal-close" onclick="closeGoalModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="modal-save" onclick="closeGoalModal()">Save & Close</button>
    </div>
  </div>
</div>

<!-- FABs -->
<div id="fab-wrap">
  <div class="fab" onclick="zoomIn()">＋</div>
  <div class="fab" onclick="zoomOut()">－</div>
  <div class="fab" onclick="resetView()">⌂</div>
</div>

<!-- LEGEND -->
<div id="legend">
  <div class="leg-item"><div class="leg-dot" style="background:var(--path-c)"></div>Pathology</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--micro-c)"></div>Microbiology</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--pharm-c)"></div>Pharmacology</div>
  <div class="leg-item"><div class="leg-line" style="border-color:var(--sand-dim)"></div>Prereq</div>
  <div class="leg-item"><div class="leg-line" style="border-color:var(--gold)"></div>Cross-link</div>
</div>

<div id="toast"></div>

<script>
// ╔══════════════════════════════════════════════════╗
// ║  DATA (same as desktop)                          ║
// ╚══════════════════════════════════════════════════╝
const NODES=[
  {id:'path_intro',subj:'path',tier:0,col:0,sz:'sm',icon:'📖',label:'Intro to Pathology',desc:'Health and disease, common terms, history from prehistoric to modern era. Subdivisions: morphological & non-morphological. Virtual microscopy & telepathology.',book:'Pathology Ch.1 · p.1',prereqs:[]},
  {id:'cell_injury',subj:'path',tier:1,col:0,sz:'lg',icon:'🔬',label:'Cell Injury & Adaptations',desc:'Etiology & pathogenesis of cell injury. Reversible vs irreversible (necrosis, apoptosis). Intracellular accumulations, pigments. Atrophy, hypertrophy, hyperplasia, metaplasia, dysplasia. Theories of ageing.',book:'Pathology Ch.2 · p.9',prereqs:['path_intro']},
  {id:'immunopath',subj:'path',tier:2,col:0,sz:'md',icon:'🛡️',label:'Immunopathology',desc:'Organs & cells of immune system, cytokines, HLA system, transplant rejection. AIDS, hypersensitivity reactions, autoimmune diseases. Amyloidosis — classification, pathogenesis, diagnosis, morphology.',book:'Pathology Ch.3 · p.44',prereqs:['cell_injury']},
  {id:'haemodynamics',subj:'path',tier:2,col:1,sz:'md',icon:'💧',label:'Haemodynamics',desc:'Normal water & electrolyte balance (Gibbs-Donnan), acid-base balance, pressure gradients. Oedema, dehydration, overhydration. Thrombosis, embolism, infarction, shock.',book:'Pathology Ch.4 · p.78',prereqs:['cell_injury']},
  {id:'inflammation',subj:'path',tier:3,col:0,sz:'lg',icon:'🔥',label:'Inflammation & Healing',desc:'Acute inflammatory response, mediators, regulatory mechanisms. Inflammatory cells. Chronic & granulomatous inflammation. Regeneration, repair, skin wound healing, stem cell concept.',book:'Pathology Ch.5 · p.116',prereqs:['cell_injury','haemodynamics','immunopath']},
  {id:'infectious_path',subj:'path',tier:4,col:1,sz:'md',icon:'🦠',label:'Infectious Diseases (Path)',desc:'Bacterial & spirochaetal pathology: plague, anthrax, pertussis, TB. Fungal: mycetoma, candidiasis. Viral: VHF, influenza, rabies, herpes. Parasitic: amoebiasis, malaria, filariasis. TORCH complex.',book:'Pathology Ch.6 · p.165',prereqs:['inflammation']},
  {id:'neoplasia',subj:'path',tier:5,col:0,sz:'lg',icon:'⚗️',label:'Neoplasia',desc:'Nomenclature & classification. Tumour characteristics, spread, grading & staging. Epidemiology, molecular pathogenesis. Chemical, physical & biologic carcinogenesis. Tumour immunology.',book:'Pathology Ch.7 · p.184',prereqs:['cell_injury','immunopath','inflammation']},
  {id:'haematology',subj:'path',tier:4,col:0,sz:'md',icon:'🩸',label:'Haematology & Anaemias',desc:'Haematopoietic organs, stem cells, bone marrow. Erythropoiesis. Iron deficiency, sideroblastic, megaloblastic, haemolytic & aplastic anaemias. Platelets, bleeding disorders, coagulation, blood groups.',book:'Pathology Ch.10–11 · p.261',prereqs:['cell_injury','haemodynamics']},
  {id:'lymphoma',subj:'path',tier:6,col:1,sz:'md',icon:'🔵',label:'Leukaemias & Lymphomas',desc:'Reactive lymphadenitis, WBC disorders. Myeloproliferative diseases, AML, MDS. Hodgkin & Non-Hodgkin lymphoma. Plasma cell disorders. Histiocytic neoplasms. Spleen & thymus.',book:'Pathology Ch.12 · p.321',prereqs:['haematology','neoplasia','immunopath']},
  {id:'cvs_path',subj:'path',tier:6,col:0,sz:'md',icon:'❤️',label:'Cardiovascular Pathology',desc:'Arteriosclerosis, atherosclerosis, vasculitis, aneurysms. Heart failure, CHD, IHD, hypertensive heart disease, cor pulmonale. Rheumatic fever, endocarditis, cardiomyopathy, pericardial disease.',book:'Pathology Ch.13–14 · p.370',prereqs:['haemodynamics','inflammation']},
  {id:'resp_path',subj:'path',tier:6,col:2,sz:'md',icon:'🫁',label:'Respiratory Pathology',desc:'Pneumonias, lung abscess, TB. COPD (bronchitis, emphysema, asthma, bronchiectasis). ILDs, pneumoconioses. Bronchogenic carcinoma. Pleural disease.',book:'Pathology Ch.15 · p.442',prereqs:['inflammation','infectious_path']},
  {id:'gi_path',subj:'path',tier:7,col:0,sz:'sm',icon:'🫀',label:'GI Pathology',desc:'Oesophagus, stomach, intestines. IBD (Crohn\'s & UC), malabsorption, appendicitis, GI tumours, polyps, GI bleeding. Peritoneum.',book:'Pathology Ch.18 · p.521',prereqs:['inflammation','neoplasia']},
  {id:'liver_path',subj:'path',tier:7,col:1,sz:'sm',icon:'🟡',label:'Liver, Biliary & Pancreas',desc:'Liver function, jaundice, viral hepatitis, cirrhosis, portal hypertension, hepatic tumours. Cholelithiasis, cholecystitis. Pancreatitis, pancreatic tumours.',book:'Pathology Ch.19 · p.577',prereqs:['haemodynamics','infectious_path','neoplasia']},
  {id:'renal_path',subj:'path',tier:8,col:0,sz:'sm',icon:'🫘',label:'Renal Pathology',desc:'Glomerular diseases, glomerular injury pathogenesis. Tubular & tubulointerstitial diseases, renal vascular disease, renal failure, tumours.',book:'Pathology Ch.20 · p.636',prereqs:['haemodynamics','immunopath','inflammation']},
  {id:'endo_path',subj:'path',tier:8,col:2,sz:'sm',icon:'🧪',label:'Endocrine Pathology',desc:'Pituitary, adrenal, thyroid, parathyroid. Endocrine pancreas: DM, islet cell tumours. Neuroendocrine system.',book:'Pathology Ch.25 · p.782',prereqs:['neoplasia','cell_injury']},
  {id:'neuro_path',subj:'path',tier:9,col:1,sz:'sm',icon:'🧠',label:'Nervous System Path',desc:'CNS: developmental anomalies, cerebrovascular diseases, infections, tumours. PNS: neuropathy, nerve sheath tumours.',book:'Pathology Ch.28 · p.863',prereqs:['inflammation','infectious_path','neoplasia']},
  // MICRO
  {id:'micro_intro',subj:'micro',tier:0,col:5,sz:'sm',icon:'🔭',label:'Intro & Microscopy',desc:'History of microbiology. Microscopy types: brightfield, darkfield, phase contrast, fluorescence, electron microscopy.',book:'Microbiology Ch.1–2 · p.3',prereqs:[]},
  {id:'bacteriology',subj:'micro',tier:1,col:5,sz:'lg',icon:'🧫',label:'General Bacteriology',desc:'Bacterial taxonomy, morphology & physiology. Lab diagnosis: staining, culture, antimicrobial susceptibility, molecular typing. Bacterial genetics, AMR, pathogenesis.',book:'Microbiology Ch.3 · p.12',prereqs:['micro_intro']},
  {id:'virology',subj:'micro',tier:2,col:5,sz:'md',icon:'🦠',label:'General Virology',desc:'Viral structure & replication. Pathogenesis mechanisms. Classification of viruses — DNA & RNA viruses, retroviruses.',book:'Microbiology Ch.4 · p.80',prereqs:['micro_intro']},
  {id:'parasitology',subj:'micro',tier:2,col:6,sz:'md',icon:'🪲',label:'Parasitology & Mycology',desc:'Protozoa, helminths, ectoparasites overview. Pathogenesis of parasitic infections. Fungal structure, replication, classification, infection mechanisms.',book:'Microbiology Ch.5–6 · p.102',prereqs:['micro_intro']},
  {id:'immunology',subj:'micro',tier:3,col:5,sz:'lg',icon:'⚗️',label:'Immunology',desc:'Innate & acquired immunity. Antigens & antibodies. Complement system. Hypersensitivity, autoimmunity, immunodeficiency. Transplant & cancer immunology. Immunoprophylaxis.',book:'Microbiology Sec.2 · p.133',prereqs:['bacteriology','virology']},
  {id:'hosp_infect',subj:'micro',tier:3,col:6,sz:'sm',icon:'🏥',label:'Hospital Infection Control',desc:'Healthcare-associated infections, sterilisation & disinfection. Biomedical waste, needle-stick injury, antimicrobial stewardship, environmental surveillance.',book:'Microbiology Sec.3 · p.229',prereqs:['bacteriology']},
  {id:'bloodstream',subj:'micro',tier:4,col:5,sz:'md',icon:'💉',label:'Bloodstream Infections',desc:'Infective endocarditis, rheumatic fever. Enteric fever (Salmonella), Rickettsial, Brucellosis, Leptospirosis. HIV/AIDS. VHFs (Dengue, Ebola). Malaria, Leishmaniasis, Filariasis, Systemic Candidiasis.',book:'Microbiology Sec.4 · p.287',prereqs:['bacteriology','virology','parasitology','immunology']},
  {id:'gi_micro',subj:'micro',tier:5,col:6,sz:'md',icon:'🦠',label:'GI Infections (Micro)',desc:'GI infective syndromes. Food poisoning. E. coli, Shigella, Salmonella, Vibrio, Campylobacter, Helicobacter, C. difficile. Rotavirus. Intestinal amoebiasis, Giardia, helminths.',book:'Microbiology Sec.5 · p.387',prereqs:['bacteriology','virology','parasitology']},
  {id:'hepato_micro',subj:'micro',tier:5,col:5,sz:'sm',icon:'🟡',label:'Hepatobiliary Infections',desc:'Hepatitis viruses A–E, Yellow fever. Amoebic liver abscess, Hydatid disease, trematode infections.',book:'Microbiology Sec.6 · p.473',prereqs:['virology','parasitology']},
  {id:'skin_micro',subj:'micro',tier:6,col:6,sz:'sm',icon:'🧬',label:'Skin & Soft Tissue Infections',desc:'Staphylococcal & streptococcal infections. Gas gangrene. Leprosy, anthrax, nocardiosis. Viral exanthems: herpes, pox, measles, rubella. Parasitic & fungal skin infections.',book:'Microbiology Sec.7 · p.503',prereqs:['bacteriology','virology','parasitology']},
  {id:'resp_micro',subj:'micro',tier:6,col:5,sz:'md',icon:'🫁',label:'Respiratory Infections',desc:'Bacterial pneumonias, atypical pneumonias (Mycoplasma, Chlamydia, Legionella). TB & NTM. Pertussis, Pseudomonas. Influenza, COVID-19, RSV. Aspergillosis, Pneumocystis.',book:'Microbiology Sec.8 · p.587',prereqs:['bacteriology','virology','parasitology','immunology']},
  {id:'cns_micro',subj:'micro',tier:7,col:5,sz:'sm',icon:'🧠',label:'CNS Infections',desc:'Bacterial meningitis (pyogenic & TB), viral meningitis & encephalitis (Rabies, Japanese encephalitis). Tetanus. Neurocysticercosis, Toxoplasmosis, Cryptococcal meningitis.',book:'Microbiology Sec.9 · p.687',prereqs:['bacteriology','virology','parasitology','immunology']},
  {id:'gu_micro',subj:'micro',tier:7,col:6,sz:'sm',icon:'⚕️',label:'Urogenital & STIs',desc:'UTI organisms. STIs: syphilis, gonorrhoea, Chlamydia, trichomoniasis, genital herpes, LGV. Vulvovaginal candidiasis.',book:'Microbiology Sec.10 · p.745',prereqs:['bacteriology','virology','parasitology']},
  // PHARM
  {id:'pharm_general',subj:'pharm',tier:0,col:9,sz:'lg',icon:'💊',label:'General Pharmacology',desc:'Routes of drug administration. Pharmacokinetics: absorption, distribution, metabolism, excretion, kinetics. Pharmacodynamics, receptor pharmacology. Adverse drug effects, clinical pharmacology.',book:'Pharmacology Sec.1 · p.1',prereqs:[]},
  {id:'ans_pharm',subj:'pharm',tier:1,col:9,sz:'md',icon:'⚡',label:'ANS Drugs',desc:'ANS general considerations. Cholinergic & anticholinergic drugs. Adrenergic drugs & antagonists. Drugs for glaucoma.',book:'Pharmacology Sec.2 · p.103',prereqs:['pharm_general']},
  {id:'autacoids',subj:'pharm',tier:2,col:9,sz:'md',icon:'🌡️',label:'Autacoids & NSAIDs',desc:'Histamine & antihistaminics. 5-HT & migraine drugs. Prostaglandins, leukotrienes. NSAIDs & antipyretic-analgesics. Antirheumatoid & antigout drugs.',book:'Pharmacology Sec.3 · p.174',prereqs:['pharm_general']},
  {id:'resp_pharm',subj:'pharm',tier:2,col:10,sz:'sm',icon:'💨',label:'Respiratory Drugs',desc:'Drugs for cough & bronchial asthma: β2-agonists, methylxanthines, anticholinergics, inhaled corticosteroids, leukotriene antagonists, cromones, anti-IgE.',book:'Pharmacology Sec.4 · p.237',prereqs:['autacoids','ans_pharm']},
  {id:'hormones_pharm',subj:'pharm',tier:3,col:10,sz:'md',icon:'🧬',label:'Hormones & Drugs',desc:'Pituitary hormones. Thyroid & antithyroid drugs. Insulin, oral antidiabetics, glucagon. Corticosteroids. Androgens, estrogens, contraceptives. Oxytocin. Calcium balance drugs.',book:'Pharmacology Sec.5 · p.255',prereqs:['pharm_general']},
  {id:'muscle_pharm',subj:'pharm',tier:3,col:9,sz:'sm',icon:'💪',label:'Peripheral NS Drugs',desc:'Skeletal muscle relaxants: depolarizing (succinylcholine) & non-depolarizing. Centrally acting relaxants. Local anaesthetics: mechanism, esters & amides, uses.',book:'Pharmacology Sec.6 · p.373',prereqs:['ans_pharm']},
  {id:'cns_pharm',subj:'pharm',tier:4,col:9,sz:'lg',icon:'🧠',label:'CNS Drugs',desc:'General anaesthetics (inhalational & IV). Sedative-hypnotics. Antiepileptic drugs. Antiparkinsonian drugs. Antipsychotics, antidepressants, anxiolytics. Opioids & antagonists. CNS stimulants.',book:'Pharmacology Sec.7 · p.399',prereqs:['ans_pharm','muscle_pharm']},
  {id:'cvs_pharm',subj:'pharm',tier:4,col:10,sz:'md',icon:'💓',label:'Cardiovascular Drugs',desc:'Renin-angiotensin drugs, nitric oxide. Cardiac glycosides & heart failure drugs. Antiarrhythmics. Antianginal & anti-ischaemic drugs. Antihypertensives.',book:'Pharmacology Sec.8 · p.521',prereqs:['ans_pharm','autacoids']},
  {id:'renal_pharm',subj:'pharm',tier:5,col:10,sz:'sm',icon:'🫘',label:'Renal Drugs',desc:'Diuretics: loop (furosemide), thiazide, potassium-sparing (spironolactone), osmotic, carbonic anhydrase inhibitors. Antidiuretics: ADH, desmopressin.',book:'Pharmacology Sec.9 · p.621',prereqs:['pharm_general']},
  {id:'blood_pharm',subj:'pharm',tier:5,col:9,sz:'sm',icon:'🩸',label:'Blood & Coagulation Drugs',desc:'Haematinics: iron, B12, folate, EPO. Anticoagulants (heparin, warfarin, DOACs), thrombolytics, antiplatelets, procoagulants. Hypolipidaemic drugs: statins, fibrates.',book:'Pharmacology Sec.10 · p.645',prereqs:['pharm_general']},
  {id:'gi_pharm',subj:'pharm',tier:6,col:10,sz:'sm',icon:'💊',label:'GI Drugs',desc:'Peptic ulcer & GERD: PPIs, H2-blockers, antacids, sucralfate, H. pylori regimens. Antiemetics: dopamine antagonists, 5-HT3 antagonists. Prokinetics. Laxatives & anti-diarrhoeals.',book:'Pharmacology Sec.11 · p.695',prereqs:['autacoids','ans_pharm']},
  {id:'antimicrobial',subj:'pharm',tier:6,col:9,sz:'lg',icon:'🧬',label:'Antimicrobial Drugs',desc:'Principles & resistance. Sulfonamides, quinolones. Beta-lactams. Tetracyclines & chloramphenicol. Aminoglycosides. Macrolides, lincosamides, glycopeptides. Antitubercular & antileprotic drugs.',book:'Pharmacology Sec.12 · p.739',prereqs:['pharm_general']},
  {id:'antifungal_av',subj:'pharm',tier:7,col:10,sz:'sm',icon:'🍄',label:'Antifungal & Antiviral',desc:'Antifungals: polyenes, azoles, echinocandins, griseofulvin, terbinafine. Antivirals (non-retroviral): acyclovir, ganciclovir, oseltamivir. Antiretrovirals: NRTIs, NNRTIs, PIs, integrase inhibitors.',book:'Pharmacology Ch.58–60 · p.838',prereqs:['antimicrobial']},
  {id:'antiparasitic',subj:'pharm',tier:7,col:9,sz:'sm',icon:'🪲',label:'Antiparasitic Drugs',desc:'Antimalarials: chloroquine, artemisinin, primaquine, mefloquine. Antiamoebics: metronidazole, tinidazole. Anti-leishmanials. Anthelmintics: albendazole, praziquantel, ivermectin.',book:'Pharmacology Ch.61–63 · p.873',prereqs:['antimicrobial']},
  {id:'anticancer',subj:'pharm',tier:8,col:9,sz:'md',icon:'⚗️',label:'Anticancer Drugs',desc:'Alkylating agents, antimetabolites, vinca alkaloids, taxanes, topoisomerase inhibitors. Targeted therapy (TKIs, monoclonal antibodies). Hormonal agents. Immunotherapy (checkpoint inhibitors).',book:'Pharmacology Sec.13 · p.915',prereqs:['antimicrobial','hormones_pharm']},
  {id:'misc_pharm',subj:'pharm',tier:8,col:10,sz:'sm',icon:'🔬',label:'Miscellaneous Drugs',desc:'Immunosuppressants (cyclosporine, tacrolimus, mycophenolate). Skin & mucous membrane drugs. Antiseptics. Chelating agents. Vitamins. Vaccines, antisera & immunoglobulins. Drug interactions.',book:'Pharmacology Sec.14 · p.937',prereqs:['pharm_general','antimicrobial']},
];

const CROSS_LINKS=[
  {from:'immunopath',to:'immunology'},{from:'inflammation',to:'autacoids'},
  {from:'infectious_path',to:'bacteriology'},{from:'infectious_path',to:'virology'},
  {from:'haematology',to:'blood_pharm'},{from:'lymphoma',to:'anticancer'},
  {from:'neoplasia',to:'anticancer'},{from:'cvs_path',to:'cvs_pharm'},
  {from:'resp_path',to:'resp_micro'},{from:'resp_path',to:'resp_pharm'},
  {from:'resp_micro',to:'antimicrobial'},{from:'gi_path',to:'gi_micro'},
  {from:'gi_path',to:'gi_pharm'},{from:'liver_path',to:'hepato_micro'},
  {from:'renal_path',to:'renal_pharm'},{from:'endo_path',to:'hormones_pharm'},
  {from:'neuro_path',to:'cns_micro'},{from:'neuro_path',to:'cns_pharm'},
  {from:'bacteriology',to:'antimicrobial'},{from:'hosp_infect',to:'antimicrobial'},
  {from:'bloodstream',to:'antimicrobial'},{from:'bloodstream',to:'antiparasitic'},
  {from:'skin_micro',to:'antimicrobial'},{from:'cns_micro',to:'antimicrobial'},
  {from:'gi_micro',to:'antimicrobial'},{from:'gi_micro',to:'antiparasitic'},
  {from:'immunology',to:'misc_pharm'},{from:'immunology',to:'immunopath'},
  {from:'ans_pharm',to:'cvs_pharm'},{from:'parasitology',to:'antiparasitic'},
  {from:'virology',to:'antifungal_av'},{from:'resp_micro',to:'antifungal_av'},
  {from:'hepato_micro',to:'antifungal_av'},
];

// ╔══════════════════════════════════════════════════╗
// ║  LAYOUT                                          ║
// ╚══════════════════════════════════════════════════╝
const COL_W=165,ROW_H=120,OX=80,OY=80;
function pos(n){return{x:OX+n.col*COL_W,y:OY+n.tier*ROW_H};}
const nodeMap={};
NODES.forEach(n=>nodeMap[n.id]=n);

// ╔══════════════════════════════════════════════════╗
// ║  STATE                                           ║
// ╚══════════════════════════════════════════════════╝
let completed=new Set(),goalNodes=new Set(),goalName='Semester I Goal';
let selectedId=null;
let scale=0.55,tx=10,ty=80;
let isDragging=false,dragStart=null,hasDragged=false;
let lastPinchDist=null;

const SK='mbbs_pwa_v1';
function save(){try{localStorage.setItem(SK,JSON.stringify({completed:[...completed],goalNodes:[...goalNodes],goalName,scale,tx,ty}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SK)||'{}');if(d.completed)completed=new Set(d.completed);if(d.goalNodes)goalNodes=new Set(d.goalNodes);if(d.goalName)goalName=d.goalName;if(d.scale){scale=d.scale;tx=d.tx;ty=d.ty;}}catch(e){}}

function isUnlocked(id){const n=nodeMap[id];if(!n)return false;if(!n.prereqs||!n.prereqs.length)return true;return n.prereqs.every(p=>completed.has(p));}

// ╔══════════════════════════════════════════════════╗
// ║  BUILD                                           ║
// ╚══════════════════════════════════════════════════╝
const world=document.getElementById('world');
const svgLayer=document.getElementById('svg-layer');

function build(){
  [...world.children].forEach(c=>{if(c!==svgLayer)c.remove();});
  svgLayer.innerHTML='';

  // Section labels
  [{text:'PATHOLOGY',colC:0.9},{text:'MICROBIOLOGY',colC:5.5},{text:'PHARMACOLOGY',colC:9.8}].forEach(l=>{
    const el=document.createElement('div');
    el.style.cssText=`position:absolute;left:${OX+l.colC*COL_W}px;top:${OY-46}px;font-family:'Cinzel Decorative',serif;font-size:.6rem;color:var(--gold);opacity:.28;letter-spacing:.22em;text-transform:uppercase;transform:translateX(-50%);pointer-events:none;white-space:nowrap;`;
    el.textContent=l.text;world.appendChild(el);
  });

  // Edges
  NODES.forEach(n=>{
    if(!n.prereqs?.length)return;
    const tp=pos(n);
    n.prereqs.forEach(pid=>{
      const pn=nodeMap[pid];if(!pn)return;
      const path=mkPath(pos(pn),tp,'prereq');
      path.dataset.from=pid;path.dataset.to=n.id;path.dataset.type='prereq';
      svgLayer.appendChild(path);
    });
  });
  CROSS_LINKS.forEach(cl=>{
    const fn=nodeMap[cl.from],tn=nodeMap[cl.to];if(!fn||!tn)return;
    const path=mkPath(pos(fn),pos(tn),'cross');
    path.dataset.from=cl.from;path.dataset.to=cl.to;path.dataset.type='cross';
    svgLayer.appendChild(path);
  });

  // Nodes
  NODES.forEach(n=>{
    const p=pos(n);
    const el=document.createElement('div');
    el.className=`node ${n.subj} sz-${n.sz}`;
    el.dataset.id=n.id;
    el.style.left=p.x+'px';el.style.top=p.y+'px';
    el.innerHTML=`<div class="node-halo"></div><div class="node-circle"><span class="node-icon">${n.icon}</span><div class="node-check">✓</div></div><div class="node-label">${n.label}</div>`;
    el.addEventListener('click',e=>{e.stopPropagation();if(!hasDragged)onNodeClick(n.id);});
    world.appendChild(el);
  });

  refreshAll();
}

function mkPath(from,to,type){
  const el=document.createElementNS('http://www.w3.org/2000/svg','path');
  const mx=(from.x+to.x)/2,my=(from.y+to.y)/2;
  const dx=to.x-from.x,dy=to.y-from.y;
  const bend=type==='cross'?0.22:0.1;
  const cx=mx-dy*bend,cy=my+dx*bend;
  el.setAttribute('d',`M ${from.x} ${from.y} Q ${cx} ${cy} ${to.x} ${to.y}`);
  el.classList.add('edge',type);return el;
}

// ╔══════════════════════════════════════════════════╗
// ║  REFRESH                                         ║
// ╚══════════════════════════════════════════════════╝
function refreshAll(){
  NODES.forEach(n=>{
    const el=document.querySelector(`.node[data-id="${n.id}"]`);if(!el)return;
    const ul=isUnlocked(n.id),dn=completed.has(n.id);
    el.classList.toggle('locked',!ul);
    el.classList.toggle('completed',dn);
    el.classList.toggle('selected',selectedId===n.id);
  });
  document.querySelectorAll('.edge.prereq').forEach(e=>{
    e.classList.toggle('unlocked-prereq',completed.has(e.dataset.from)||completed.has(e.dataset.to));
  });
  highlightEdges();updateHUD();
}

function highlightEdges(){
  if(!selectedId){
    document.querySelectorAll('.edge').forEach(e=>e.classList.remove('active','dimmed'));
    document.querySelectorAll('.node').forEach(e=>e.style.opacity='1');
    return;
  }
  const rel=new Set([selectedId]);
  const n=nodeMap[selectedId];
  n.prereqs?.forEach(p=>rel.add(p));
  NODES.forEach(m=>{if(m.prereqs?.includes(selectedId))rel.add(m.id);});
  CROSS_LINKS.forEach(cl=>{if(cl.from===selectedId)rel.add(cl.to);if(cl.to===selectedId)rel.add(cl.from);});
  document.querySelectorAll('.edge').forEach(e=>{
    const direct=e.dataset.from===selectedId||e.dataset.to===selectedId;
    e.classList.toggle('active',direct);
    e.classList.toggle('dimmed',!direct&&!(rel.has(e.dataset.from)&&rel.has(e.dataset.to)));
  });
  document.querySelectorAll('.node').forEach(el=>{
    el.style.opacity=rel.has(el.dataset.id)?'1':'0.15';
  });
}

// ╔══════════════════════════════════════════════════╗
// ║  HUD                                             ║
// ╚══════════════════════════════════════════════════╝
function updateHUD(){
  const total=NODES.length,done=completed.size;
  const ovP=Math.round(done/total*100);
  document.getElementById('overall-pct').textContent=ovP+'%';
  document.getElementById('overall-fill').style.width=ovP+'%';
  ['path','micro','pharm'].forEach(s=>{
    const ns=NODES.filter(n=>n.subj===s);
    const dc=ns.filter(n=>completed.has(n.id)).length;
    document.getElementById(`${s}-pct`).textContent=Math.round(dc/ns.length*100)+'%';
  });
  const gT=goalNodes.size;
  if(!gT){document.getElementById('goal-pct-display').textContent='—';}
  else{const gD=[...goalNodes].filter(id=>completed.has(id)).length;document.getElementById('goal-pct-display').textContent=Math.round(gD/gT*100)+'%';}
  document.getElementById('goal-name-display').textContent=goalName.length>10?goalName.slice(0,10)+'…':goalName;
}

// ╔══════════════════════════════════════════════════╗
// ║  NODE CLICK                                      ║
// ╚══════════════════════════════════════════════════╝
function onNodeClick(id){
  if(selectedId===id){
    selectedId=null;closeSheet();
    document.querySelectorAll('.node').forEach(e=>{e.style.opacity='1';e.classList.remove('selected');});
    document.querySelectorAll('.edge').forEach(e=>e.classList.remove('active','dimmed'));
    return;
  }
  selectedId=id;refreshAll();openSheet(id);
}

function openSheet(id){
  const n=nodeMap[id];
  const ul=isUnlocked(id),dn=completed.has(id);
  const sc=n.subj==='path'?'var(--path-c)':n.subj==='micro'?'var(--micro-c)':'var(--pharm-c)';
  const sn=n.subj==='path'?'Pathology':n.subj==='micro'?'Microbiology':'Pharmacology';
  document.getElementById('sheet-badge').innerHTML=`<div class="badge-dot" style="background:${sc}"></div><span style="color:${sc}">${sn}</span>`;
  document.getElementById('sheet-title').textContent=n.label;
  document.getElementById('sheet-ref').textContent=n.book;
  document.getElementById('sheet-desc').textContent=n.desc;
  let st='';
  if(dn)st=`<div class="unlock-status done">✓ Mastered</div>`;
  else if(ul)st=`<div class="unlock-status unlocked">🔓 Unlocked — Ready to study</div>`;
  else st=`<div class="unlock-status locked">🔒 Locked — Complete prerequisites first</div>`;
  document.getElementById('sheet-status').innerHTML=st;
  let ph='';
  if(n.prereqs?.length){ph=`<div><div class="sheet-section">Prerequisites</div><div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;">`;n.prereqs.forEach(pid=>{const pn=nodeMap[pid];const d=completed.has(pid);ph+=`<div class="prereq-pill ${d?'done':''}" onclick="onNodeClick('${pid}')"><div class="dot" style="background:${d?'var(--pharm-c)':'var(--locked-b)'}"></div>${pn?.label||pid}</div>`;});ph+='</div></div>';}
  const unlocks=NODES.filter(m=>m.prereqs?.includes(id));
  let uh='';
  if(unlocks.length){uh=`<div><div class="sheet-section">Unlocks</div><div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;">`;unlocks.forEach(m=>{uh+=`<div class="prereq-pill" onclick="onNodeClick('${m.id}')">→ ${m.label}</div>`;});uh+='</div></div>';}
  document.getElementById('sheet-prereqs').innerHTML=ph;
  document.getElementById('sheet-unlocks').innerHTML=uh;
  const cb=document.getElementById('complete-btn');
  if(!ul&&!dn){cb.className='complete-btn mark';cb.textContent='🔒 Locked';cb.style.opacity='.4';cb.style.pointerEvents='none';}
  else{cb.style.opacity='1';cb.style.pointerEvents='auto';if(dn){cb.className='complete-btn unmark';cb.textContent='✗ Mark Incomplete';}else{cb.className='complete-btn mark';cb.textContent='✓ Mark as Mastered';}}
  const gb=document.getElementById('goal-toggle-btn');
  gb.classList.toggle('in-goal',goalNodes.has(id));
  document.getElementById('bottom-sheet').classList.add('open');
  document.getElementById('fab-wrap').classList.add('sheet-open');
}
function closeSheet(){
  document.getElementById('bottom-sheet').classList.remove('open');
  document.getElementById('fab-wrap').classList.remove('sheet-open');
}

// ╔══════════════════════════════════════════════════╗
// ║  COMPLETE / GOAL                                 ║
// ╚══════════════════════════════════════════════════╝
function toggleComplete(){
  if(!selectedId)return;
  const ul=isUnlocked(selectedId),dn=completed.has(selectedId);
  if(!ul&&!dn)return;
  if(dn){
    const deps=NODES.filter(m=>m.prereqs?.includes(selectedId)&&completed.has(m.id));
    if(deps.length){showToast('⚠ Cannot unmark — dependent topics completed');return;}
    completed.delete(selectedId);showToast('📖 Marked incomplete');
  }else{
    completed.add(selectedId);burst(selectedId);showToast('⭐ Mastered! New paths may be open.');
  }
  save();refreshAll();openSheet(selectedId);
}
function burst(id){
  const el=document.querySelector(`.node[data-id="${id}"] .node-circle`);if(!el)return;
  const b=document.createElement('div');b.className='unlock-burst';el.appendChild(b);setTimeout(()=>b.remove(),800);
}
function toggleGoal(){
  if(!selectedId)return;
  if(goalNodes.has(selectedId))goalNodes.delete(selectedId);
  else goalNodes.add(selectedId);
  save();updateHUD();openSheet(selectedId);
}

// ╔══════════════════════════════════════════════════╗
// ║  GOAL MODAL                                      ║
// ╚══════════════════════════════════════════════════╝
function openGoalModal(){renderGoalModal();document.getElementById('goal-modal').classList.add('open');}
function closeGoalModal(){
  goalName=document.getElementById('goal-name-input')?.value||goalName;
  save();updateHUD();document.getElementById('goal-modal').classList.remove('open');
}
function handleModalBgClick(e){if(e.target===document.getElementById('goal-modal'))closeGoalModal();}

function renderGoalModal(){
  const gT=goalNodes.size,gD=[...goalNodes].filter(id=>completed.has(id)).length,gP=gT?Math.round(gD/gT*100):0;
  const sc={path:'var(--path-c)',micro:'var(--micro-c)',pharm:'var(--pharm-c)'};
  const sn={path:'Pathology',micro:'Microbiology',pharm:'Pharmacology'};
  const sg={path:[],micro:[],pharm:[]};
  NODES.forEach(n=>sg[n.subj].push(n));
  let h=`
    <div class="goal-name-section"><div class="goal-name-label">Goal Name</div>
    <input class="goal-name-input" id="goal-name-input" value="${goalName}" placeholder="e.g. Semester I — General Path"></div>
    <div class="goal-stats">
      <div class="goal-stat"><div class="goal-stat-val">${gT}</div><div class="goal-stat-lbl">Topics</div></div>
      <div class="goal-stat"><div class="goal-stat-val">${gD}</div><div class="goal-stat-lbl">Done</div></div>
      <div class="goal-stat"><div class="goal-stat-val">${gP}%</div><div class="goal-stat-lbl">Progress</div></div>
    </div>
    <div class="prog-bar" style="height:5px;margin-bottom:4px;"><div class="prog-fill" style="width:${gP}%;background:linear-gradient(90deg,var(--amber-dim),var(--amber))"></div></div>
  `;
  ['path','micro','pharm'].forEach(s=>{
    const ni=sg[s].filter(n=>goalNodes.has(n.id)).length;
    const nd=sg[s].filter(n=>goalNodes.has(n.id)&&completed.has(n.id)).length;
    h+=`<div class="modal-subj-section"><div class="modal-subj-header"><span style="color:${sc[s]}">${sn[s]}</span><span style="color:var(--sand-dim)">${nd}/${ni} done</span></div><div class="modal-nodes">`;
    sg[s].forEach(n=>{const ig=goalNodes.has(n.id),dn=completed.has(n.id);h+=`<div class="goal-node-pill ${ig?'in-goal':''} ${ig&&dn?'done':''}" onclick="modalToggle('${n.id}')"><span class="gnp-icon">${n.icon}</span>${n.label}${dn?' ✓':''}</div>`;});
    h+='</div></div>';
  });
  document.getElementById('modal-body').innerHTML=h;
}
function modalToggle(id){if(goalNodes.has(id))goalNodes.delete(id);else goalNodes.add(id);save();renderGoalModal();updateHUD();}

// ╔══════════════════════════════════════════════════╗
// ║  PAN / ZOOM — FIXED MOBILE                       ║
// ╚══════════════════════════════════════════════════╝
const vp=document.getElementById('viewport');

// Compute the minimum scale so the whole tree fits on screen
function minScale(){
  const maxCol=Math.max(...NODES.map(n=>n.col));
  const maxTier=Math.max(...NODES.map(n=>n.tier));
  const treeW=OX*2+maxCol*COL_W+120;
  const treeH=OY*2+maxTier*ROW_H+120;
  const hudH=document.getElementById('hud').offsetHeight||72;
  const sw=window.innerWidth/treeW;
  const sh=(window.innerHeight-hudH)/treeH;
  return Math.min(sw,sh,0.65); // never bigger than 0.65 for min
}

function clampScale(s){return Math.min(1.8,Math.max(minScale(),s));}

function applyT(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}

function zoomIn(){scale=clampScale(scale+0.12);applyT();save();}
function zoomOut(){scale=clampScale(scale-0.12);applyT();save();}

function resetView(){
  const ms=minScale();
  scale=ms;
  // Centre the tree
  const maxCol=Math.max(...NODES.map(n=>n.col));
  const maxTier=Math.max(...NODES.map(n=>n.tier));
  const treeW=OX*2+maxCol*COL_W+120;
  const treeH=OY*2+maxTier*ROW_H+120;
  const hudH=document.getElementById('hud').offsetHeight||72;
  tx=(window.innerWidth-treeW*scale)/2;
  ty=hudH+(window.innerHeight-hudH-treeH*scale)/2;
  applyT();
}

// ── MOUSE (desktop/browser) ──
vp.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  isDragging=true;hasDragged=false;
  dragStart={x:e.clientX-tx,y:e.clientY-ty};
  vp.style.cursor='grabbing';
});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  const ndx=e.clientX-dragStart.x,ndy=e.clientY-dragStart.y;
  if(Math.abs(ndx-tx)>4||Math.abs(ndy-ty)>4)hasDragged=true;
  tx=ndx;ty=ndy;applyT();
});
window.addEventListener('mouseup',()=>{
  if(!isDragging)return;
  isDragging=false;vp.style.cursor='grab';save();
  setTimeout(()=>{hasDragged=false;},50);
});
vp.addEventListener('wheel',e=>{
  e.preventDefault();
  scale=clampScale(scale+(e.deltaY>0?-0.07:0.07));applyT();
},{passive:false});

// ── TOUCH ──
// KEY FIX: We handle everything in touchend for taps (not touchstart/click).
// touchstart only records start position. touchmove pans. touchend decides tap vs drag.

let touchStartPos=null;
let touchStartTime=0;

vp.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    // Record start — do NOT preventDefault yet so nodes can still receive touch
    isDragging=false;
    hasDragged=false;
    touchStartPos={x:e.touches[0].clientX,y:e.touches[0].clientY};
    touchStartTime=Date.now();
    dragStart={x:e.touches[0].clientX-tx,y:e.touches[0].clientY-ty};
  } else if(e.touches.length===2){
    e.preventDefault();
    isDragging=false;
    hasDragged=true; // treat pinch as "dragged" so no tap fires
    lastPinchDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
  }
},{passive:true}); // passive:true for single touch so nodes get events too

vp.addEventListener('touchmove',e=>{
  if(e.touches.length===1){
    const t=e.touches[0];
    const dx=Math.abs(t.clientX-(touchStartPos?.x||0));
    const dy=Math.abs(t.clientY-(touchStartPos?.y||0));
    if(dx>8||dy>8){
      // It's a pan — now we need to prevent default to stop page scroll
      e.preventDefault();
      isDragging=true;
      hasDragged=true;
      tx=t.clientX-dragStart.x;
      ty=t.clientY-dragStart.y;
      applyT();
    }
  } else if(e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    if(lastPinchDist){
      scale=clampScale(scale+(d-lastPinchDist)*0.005);applyT();
    }
    lastPinchDist=d;
  }
},{passive:false});

vp.addEventListener('touchend',e=>{
  const wasDrag=hasDragged;
  isDragging=false;
  lastPinchDist=null;

  if(!wasDrag && touchStartPos && (Date.now()-touchStartTime)<300){
    // It's a tap — find what was under the finger
    const touch=e.changedTouches[0];
    const el=document.elementFromPoint(touch.clientX,touch.clientY);

    // Walk up DOM to find a .node
    let target=el;
    let nodeEl=null;
    for(let i=0;i<6;i++){
      if(!target)break;
      if(target.classList&&target.classList.contains('node')){nodeEl=target;break;}
      target=target.parentElement;
    }

    if(nodeEl&&nodeEl.dataset.id){
      // Tapped a node
      onNodeClick(nodeEl.dataset.id);
    } else {
      // Tapped background — deselect
      const isBackground=!el||el===vp||el===world||el===svgLayer||
        el.closest('#bottom-sheet')||el.closest('#hud')||
        el.closest('#goal-modal')||el.closest('#fab-wrap')||
        el.closest('#legend');
      if(!isBackground){
        selectedId=null;closeSheet();
        document.querySelectorAll('.node').forEach(n=>{n.style.opacity='1';n.classList.remove('selected');});
        document.querySelectorAll('.edge').forEach(n=>n.classList.remove('active','dimmed'));
      }
    }
  }

  touchStartPos=null;
  save();
  setTimeout(()=>{hasDragged=false;},80);
},{passive:true});

// Mouse click for deselect on desktop
vp.addEventListener('click',e=>{
  if((e.target===vp||e.target===world||e.target===svgLayer)&&!hasDragged){
    selectedId=null;closeSheet();
    document.querySelectorAll('.node').forEach(el=>{el.style.opacity='1';el.classList.remove('selected');});
    document.querySelectorAll('.edge').forEach(el=>el.classList.remove('active','dimmed'));
  }
});

// Sheet swipe-down to close
let sheetTouchY=null;
const bs=document.getElementById('bottom-sheet');
bs.addEventListener('touchstart',e=>{sheetTouchY=e.touches[0].clientY;},{passive:true});
bs.addEventListener('touchmove',e=>{
  if(sheetTouchY&&e.touches[0].clientY-sheetTouchY>55){
    selectedId=null;closeSheet();refreshAll();sheetTouchY=null;
  }
},{passive:true});

// ╔══════════════════════════════════════════════════╗
// ║  TOAST                                           ║
// ╚══════════════════════════════════════════════════╝
let toastT=null;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

// ╔══════════════════════════════════════════════════╗
// ║  BACKGROUND GRID                                 ║
// ╚══════════════════════════════════════════════════╝
function drawBg(){
  const c=document.getElementById('bg-canvas');
  c.width=window.innerWidth;c.height=window.innerHeight;
  const ctx=c.getContext('2d');ctx.strokeStyle='rgba(200,169,110,1)';ctx.lineWidth=0.4;
  const sp=52;
  for(let x=0;x<c.width;x+=sp){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke();}
  for(let y=0;y<c.height;y+=sp){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke();}
}

// ╔══════════════════════════════════════════════════╗
// ║  OFFLINE DETECTION                               ║
// ╚══════════════════════════════════════════════════╝
window.addEventListener('online',()=>document.getElementById('offline-banner').style.display='none');
window.addEventListener('offline',()=>document.getElementById('offline-banner').style.display='block');

// ╔══════════════════════════════════════════════════╗
// ║  SERVICE WORKER REGISTRATION                     ║
// ╚══════════════════════════════════════════════════╝
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(()=>{
      console.log('SW registered');
    }).catch(e=>console.log('SW failed:',e));
  });
}

// ╔══════════════════════════════════════════════════╗
// ║  INIT                                            ║
// ╚══════════════════════════════════════════════════╝
load();build();drawBg();

// On first load fit tree to screen; on return restore saved position clamped to valid range
if(!localStorage.getItem(SK)){
  resetView();
} else {
  scale=clampScale(scale);
  applyT();
}

window.addEventListener('resize',()=>{drawBg();});
</script>
